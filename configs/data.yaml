# SolarSentinel data rules. Every pipeline script reads this file (one source of truth, avoids train/serve skew).
# See docs/data-pipeline-plan.md for the reasoning behind each value.

storage:
  gcp_project: ai-systems-egn6216
  bucket: solarsentinel_ai-systems-egn6216 # not a secret; public read, ADC write
  local_root: data # mirrors the bucket layout exactly
  prefixes:
    goes_sci: raw/goes/sci_flare_summary
    goes_ops: raw/goes/ops_event_reports
    goes_swpc: raw/goes/swpc_event_reports
    sharp_keywords: raw/jsoc/sharp_keywords
    sharp_br_pilot: raw/jsoc/sharp_cea_720s_Br/pilot
    interim: interim
    processed: processed
  dataset_version: v1

sources:
  sharp:
    series: hmi.sharp_cea_720s
    segment: Br
    time_scale: TAI # T_REC is TAI; convert with astropy Time(..., scale="tai").utc
    jsoc_email_env: JSOC_EMAIL # loaded from untracked .env
    # All keys checked 2026-10-06 against drms Client().info("hmi.sharp_cea_720s").keywords.
    keys:
      ids: [
          HARPNUM,
          T_REC,
          NOAA_AR,
          NOAA_NUM,
          NOAA_ARS,
          LON_FWT,
          LAT_FWT,
          LAT_MIN, # bounding box (Stonyhurst deg), for location attribution in step 3
          LAT_MAX,
          LON_MIN,
          LON_MAX,
          QUALITY,
        ]
      summary:
        [
          USFLUX,
          MEANGAM,
          MEANGBT,
          MEANGBZ,
          MEANGBH,
          MEANJZD,
          TOTUSJZ,
          MEANALP,
          MEANJZH,
          TOTUSJH,
          ABSNJZH,
          SAVNCPP,
          MEANPOT,
          TOTPOT,
          MEANSHR,
          SHRGT45,
          R_VALUE,
          AREA_ACR,
        ]
    keyword_cadence: null # null = every record (12 min); fallback "1h" adds @1h to the T_REC range
    jsoc_timeout_s: 600 # socket timeout for one keyword query
    max_query_days: 8 # JSOC rs_list fails (status 6) on a full month, e.g. 2011-03; months are split into <= 8-day queries
  goes_sci:
    url: "https://www.ncei.noaa.gov/data/goes-space-environment-monitor/access/science/xrs/goes15/xrsf-l2-flsum_science/sci_xrsf-l2-flsum_g15_y{year}_v2-3-0.nc"
    years: [2010, 2020] # available range, inclusive
    peak_status: EVENT_PEAK
  goes_ops:
    url: "https://www.ngdc.noaa.gov/stp/space-weather/solar-data/solar-features/solar-flares/x-rays/goes/xrs/{filename}"
    filename: "goes-xrs-report_{year}.txt"
    filename_overrides: # checked 2026-10-06 against the directory listing
      2015: goes-xrs-report_2015_modifiedreplacedmissingrows.txt # regular 2015 file lacks 2015-09-23..30 (64 rows)
      2017: goes-xrs-report_2017-ytd.txt # no full-year file; year-to-date file ends 2017-06-28
  goes_swpc: # fallback for days after the last NGDC ops date (2017 H2)
    url: "https://www.ngdc.noaa.gov/stp/space-weather/swpc-products/daily_reports/solar_event_reports/{year}/{month:02d}/{date}events.txt"
    region_offset: 10000 # SWPC lists 4-digit region numbers (2673 -> 12673)
  scale_factor_ops_to_sci: 0.7 # ops fluxes = sci fluxes x 0.7 (SWPC scaling); sci ~ ops / 0.7

period:
  start: "2011-01-01"
  end: "2017-12-31"

splits: # chronological; a HARP crossing a boundary goes to the earlier split
  train: ["2011-01-01", "2014-12-31"]
  val: ["2015-01-01", "2015-12-31"]
  replay: ["2016-01-01", "2017-12-31"]

sampling:
  slot_hours_utc: [0, 6, 12, 18]
  slot_tolerance_minutes: 60 # nearest record within +-60 min; never sample on exact clock times
  # Prefer the nearest QUALITY == 0 record within the tolerance, else the nearest record (flagged).
  # The 06:00/06:12/18:00/18:12 TAI records carry 0x00010400 every day in 2011-2015 (user decision 2026-10-06).
  prefer_quality_zero: true

filters:
  require_noaa_ar: true # keep NOAA_AR != 0
  max_abs_lon_fwt_deg: 60 # a record with LON_FWT = MISSING (no active pixels) is dropped and counted
  quality_nonzero: flag # flag for now; drop decision later

attribution: # flares without an ops NOAA region (plan section 4); methods a-d in order
  missing_locations: [N00E00] # placeholder location in the ops list -> treat as missing
  record_gap_minutes: 60 # c: a HARP's nearest record must lie within +-this of the flare peak
  bbox_margin_deg: 2 # c: location inside LAT/LON_MIN/MAX +- margin (pilot: 51/51 region flares inside own box at 2 deg)
  fwt_tolerance_deg: 10 # c: else nearest (LAT_FWT, LON_FWT) within this great-circle distance (pilot p95 9.1 deg)

labels:
  horizon_hours: 24 # flare peak in (t, t + 24 h], t = T_REC in UTC
  positive_min_class: M1.0 # science scale; also the class threshold of has_unattributed_mx
  ops_match_tolerance_minutes: 5 # sci peak <-> ops peak; tune and report unmatched
  # false (user decision 2026-10-06): flagged negatives stay in v1 with has_unattributed_mx = true;
  # excluding them is a training-time filter. Counts per split are reported either way.
  drop_unattributed_mx_from_negatives: false
  max_unattributed_drop_fraction: 0.20 # only when the drop is on: stop before writing if it removes more of any split's negatives

cutouts:
  size: [128, 128]
  dtype: float16

pilot:
  start: "2014-10-20"
  end: "2014-10-27"
  harpnum: 4698 # AR 12192, X3.1 on 2014-10-24

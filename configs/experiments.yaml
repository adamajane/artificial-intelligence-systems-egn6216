# SolarSentinel experiment settings (First Model Exploration, docs/2-model-experiment-plan.md).
# Data rules stay in configs/data.yaml; this file holds seeds, subset sizes, recipes and model IDs.

fme:
  prefix: processed/v1/experiments/fme # targets.parquet, cutouts/ (shards + index.parquet)
  targets:
    seed: 42
    # Strata (plan 0.3): VP/VN = val positives/negatives, TP/TN = train positives/negatives.
    # Negatives are sampled from all negatives, has_unattributed_mx ones included.
    # Tier 1 is interleaved in `pattern` (233 rounds = 1,398 targets): any prefix that finishes is a
    # stratified sample with about 1:2 positives to negatives in both splits.
    tier1: { VP: 233, VN: 466, TP: 233, TN: 466 }
    pattern: [VP, VN, VN, TP, TN, TN]
    # Tier 2, after tier 1, in case the download runs faster than expected: more train data, same 1:2.
    tier2: { TP: 233, TN: 466 }
    tier2_pattern: [TP, TN, TN]
  # Recipe (plan 0.5): runs A and B are identical except the architecture.
  recipe:
    seed: 42
    extra_seeds: [0, 1] # seed check for A and B (plan 0.5)
    clip_percentile: 99.5 # c = this percentile of |Br| over train pixels; input = clip(Br, -c, c) / c
    augment: { hflip: 0.5, vflip: 0.5, polarity: 0.5 } # train only; polarity flip = x -> -x
    epochs: 15
    batch_size: 32
    lr: 1.0e-4
    weight_decay: 0.05
    warmup_epochs: 1 # linear warmup, then cosine to 0 (per step)
  models:
    A: { name: resnet18.a1_in1k, hf_repo: timm/resnet18.a1_in1k, license: Apache-2.0 }
    B: { name: deit_tiny_patch16_224.fb_in1k, hf_repo: timm/deit_tiny_patch16_224.fb_in1k, license: Apache-2.0, kwargs: { img_size: 128 } }
  eval:
    val_negatives_total: 5604 # natural 2015 val negatives; weight per downloaded val negative = this / n (plan 0.4)
    bootstrap_reps: 1000
    bootstrap_seed: 0
    reliability_bins: 10
  latency: { warmup: 20, reps: 200, batch_sizes: [1, 15], threads: null } # CPU, inference_mode; null = torch default
  results_dir: experiments/results

m4: # Milestone 4 (docs/3-milestone4-plan.md)
  prefix: processed/v2/experiments/m4 # targets.parquet; cutouts_stretch/ (E2 comparison arm)
  targets:
    seed: 42
    # Tonight's download list (plan 2.4): only rows with no FITS on disk (full or pilot root), after the v2 gap.
    # Val first: every remaining positive and neg_per_pos negatives each, from all negatives (evaluation rule).
    # Then train: every remaining positive and neg_per_pos negatives each, from clean negatives only (the training
    # rule excludes has_unattributed_mx negatives, so downloading them is wasted). Any prefix that finishes is 1:2.
    neg_per_pos: 2
    val_pattern: [VP, VN, VN]
    train_pattern: [TP, TN, TN]
  # Shared recipe (plan 4): the first-exploration recipe with 20 epochs. The final epoch is evaluated, no early
  # stopping (selecting on val twice would inflate it; a change from Milestone 3's R4 control).
  recipe:
    seed: 42
    extra_seeds: [0, 1]
    clip_percentile: 99.5 # c per arm, over that arm's train pixels
    # c over non-zero pixels only (developer decision 2026-11-02): padding makes ~48% of pad-arm pixels 0, which pulls
    # the all-pixel c down to 729.5 G (pad) vs 1,090.0 G (stretch) on the 667-image dry run; over non-zero pixels
    # 1,026.0 vs 1,094.0, so E2 changes the shape, not the clip level.
    clip_exclude_zero: true
    augment: { hflip: 0.5, vflip: 0.5, polarity: 0.5 }
    epochs: 20
    batch_size: 32
    lr: 1.0e-4
    weight_decay: 0.05
    warmup_epochs: 1
  models: { A: resnet18, B: deit_tiny } # keys of fme.models -> run-ID names
  eval:
    val_negatives_total: 4977 # gap-corrected natural 2015 val negatives (processed/v2/split_audit.json)
    bootstrap_reps: 1000
    bootstrap_seed: 0
    reliability_bins: 10
    calibration_folds: 2 # E3: HARP-grouped cross-fitting within val
    calibration_bins: 5 # E3 PR2 check 3: equal-count bins
    thin_aspect: 2.0 # E2: thin region = long side / short side >= this
  results_dir: experiments/results

m5: # Milestones 5-6 (docs/4-milestone5-plan.md). The v2 block in data.yaml is not touched (its hash is in the M4 manifest).
  results_dir: experiments/results/m5
  replay_prefix: processed/v2/replay # targets.parquet, cutouts/ (shards + index.parquet), manifest.json (plan 4.2)
  coverage_prefix: processed/v2/m5 # coverage_<split>.parquet: assessed / not_assessed / no_data per slot (plan 4.3)
  bundle: # plan 2: retrain the selected model once with the exact M4 recipe and freeze it
    prefix: models # bucket-relative (data/models/ locally, gitignored); containers fetch it over public HTTPS
    run_id: m5_bundle_resnet18_pad_s42
    model: A # fme.models key: resnet18.a1_in1k
    arm: pad
    seed: 42
    expected_clip_c: 980.5 # M4 pad arm; a different c means the training data or code differ: stop (plan 2.1)
    accept_val_tss: [0.66, 0.72] # plan 2.5, decided before the retrain: M4 0.692 +- 0.014 over 3 seeds, about +-2 sd
    m4_threshold: 0.048 # M4 calibrated threshold (old weights), reported next to the re-picked one
    parity_max_abs_diff: 1.0e-5 # plan 10: API score vs the CPU-path score
  final_test: # plan 5, pre-registered in docs/4-milestone5-preregistration.md (frozen with that commit; never tuned on replay)
    bundle_id: 0101774eb973e9cfa7f297796fe4927f0d8f723058c6a6a6fa74905aa81fe452 # sha256 of the bundle file (plan 2.4)
    bundle_file: models/solarsentinel-resnet18-pad-0101774eb973.pt # bucket-relative
    replay_targets_sha256: 657e7869ddd8b4234c423c23ee690c39e03411eda058f924643d5bcb0f993d76
    run_id_prefix: m5_final_test # run ID = <prefix>_<bundle short hash>
    pr1_min_tss: 0.5 # point estimate at the frozen threshold; plus paired CI vs persistence excluding 0
    pr2_ratio_range: [0.5, 2.0] # check 1: mean p / observed rate
    pr2_bins: 5 # check 3: equal-count bins, at most pr2_max_bin_misses misses
    pr2_max_bin_misses: 1
    r1_max_val_test_tss_gap: 0.15 # R1 trigger
    slice_min_positives: 10 # recall / false-alarm share / TSS only for slices with at least this many positives
    usflux_cuts: [2.342232e+22, 3.853554e+22] # M4 terciles of the 208 val positives: low <= a < mid <= b < high
    cmd_cuts_deg: [30, 60] # |LON_FWT| 0-30, 30-60
    thin_aspect: 2.0
    single_region: { harpnum: 7115, noaa_ar: 12673 } # 40 of the 62 M/X flares in 2017 (PR1 note)
    climatology_rate_2015: 0.0401 # 208 / 5185, gap-corrected natural val rate (fixed-climatology baseline row)
    calibration_window_days: 30 # rolling mean p / observed rate (plan 5.4)
    error_gallery_k: 8
    bootstrap: { reps: 1000, seed: 0 }
  monitoring: # plan 8; expected ranges from val (bundle report) or design
    s1_data_age_h: { expected_max: 6, trigger: 12 }
    # S2: rolling 30-day median of each cutout's median non-zero |Br|, over the train reference (pad arm, 3,117 cutouts).
    # Band from val (Claude default, 2026-11-20): val's rolling ratio spans 0.74-1.38, so the plan's [0.8, 1.25] would fire on
    # 13.7% of normal val windows; [0.67, 1.5] fires on 0% of them and still catches a x2 / x0.5 unit change.
    s2_input: { max_reject_share: 0.10, train_median_abs_br_g: 24.5703125, window_days: 30, min_regions: 5, br_ratio_range: [0.67, 1.5] }
    s3_alert_share: { val_share: 0.1761, trigger_factor: 2.0 } # trigger above 2x or below 0.5x of the val share
    s4_calibration: { window_days: 30, ratio_range: [0.5, 2.0] }
    s5_scorer: { max_5xx_share: 0.01, p95_ms: 100 }
  api: # scorer C7a (plan 6.2, 9); limits are checked before anything reaches the model
    max_body_bytes: { /v1/score: 262144, /v1/score/fits: 16777216, default: 16384 } # 128x128 float32 .npy = 65,664 B; largest SHARP Br FITS on disk 10.3 MB
    max_abs_br_g: 10000 # physical sanity bound on |Br| (Gauss); a unit/scale shift below it is S2's job, not a reject
    sources: [replay, dev, test, walkthrough, live]
    max_noaa_ars_chars: 64
  dashboard: # plan 6.5, 12
    primary_slot: "2017-09-05T12:00:00Z" # walkthrough scenario: AR 12673 before its X9.3 flare
    stale_data_age_h: 30 # ?scenario=stale shows data this much older than the clock (S1 trigger is 12 h)
  deploy: # plan 6.6: containers fetch over public HTTPS; these pins (in git) anchor every sha256 check
    bundle_card_sha256: 305afe8cf2058bc34acaf45ddd54e8f9d39d2059757c626b2a895c0c4cc84076
    v2_manifest_sha256: 10816699b251c80f94479a133e0d83f0d8b66e0e48da64459d9b07924ddf580a # unchanged since M4
    m5_manifest_sha256: f1918b17c6f565dceaddccc27051d5c69f514bc2fd2cfca974d57486c1fbee2a # processed/v2/m5 (coverage, outcomes)
    replay_manifest_sha256: ffdf4352acd7f0e207233f3b62e11221c9beaed749184bdb6c907c0721cb73dc # processed/v2/replay (cutouts 5,101 + index, targets, inputs_check), built 2026-11-21

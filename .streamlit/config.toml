# Dashboard runtime settings (plan 6.5, 9): no developer toolbar or tracebacks for users, no usage telemetry.
[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f4e79" # contrast 8.9:1 on white

# SolarSentinel local stack (plan 6.6): the system of record. `docker compose up --build`, then open
# http://127.0.0.1:8501 (dashboard), :3000 (Grafana), :9090 (Prometheus). Every host port is bound to 127.0.0.1 (T5).
# No credentials: data and the model bundle come from the public bucket over HTTPS, sha256-checked against hashes
# pinned in configs/experiments.yaml.
name: solarsentinel

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  scorer:
    build: { context: ., dockerfile: deploy/scorer.Dockerfile }
    image: solarsentinel-scorer:local
    <<: *hardening
    environment:
      SOLARSENTINEL_MODE: ${SOLARSENTINEL_MODE:-probability}
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 1g
    restart: unless-stopped

  replay:
    build: { context: ., dockerfile: deploy/dashboard.Dockerfile }
    image: solarsentinel-dashboard:local
    <<: *hardening
    command: ["sh", "deploy/dashboard/replay.sh"]
    environment:
      FETCH_SETS: ${FETCH_SETS:-dev}
      REPLAY_SPLIT: ${REPLAY_SPLIT:-val}
      REPLAY_KIND: ${REPLAY_KIND:-demo}
      REPLAY_RUN_ID: ${REPLAY_RUN_ID:-}
      REPLAY_REASON: ${REPLAY_REASON:-docker compose replay}
      REPLAY_OUTCOMES: ${REPLAY_OUTCOMES:-processed/v2/m5/outcomes_val.parquet}
      REPLAY_EXTRA: ${REPLAY_EXTRA:---drop-uncut}
      SLOT_SECONDS: ${SLOT_SECONDS:-0}
      SCORER_URL: http://scorer:8000
    volumes: ["ss-data:/app/data"]
    ports: ["127.0.0.1:9101:9101"]
    depends_on:
      scorer: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: "no"

  dashboard:
    image: solarsentinel-dashboard:local
    <<: *hardening
    environment:
      SOLARSENTINEL_STORE: /app/data/store/solarsentinel.db
      SOLARSENTINEL_MODE: ${SOLARSENTINEL_MODE:-}
      SOLARSENTINEL_RUN: ${SOLARSENTINEL_RUN:-}
      HOME: /tmp
    volumes: ["ss-data:/app/data"]
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [replay]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    <<: *hardening
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    volumes: ["./deploy/prometheus:/etc/prometheus:ro", "prom-data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    <<: *hardening
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Admin only if a password is set in the untracked .env (GRAFANA_ADMIN_PASSWORD); otherwise no login at all.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN:-true}
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/solarsentinel.json
    volumes: ["./deploy/grafana/provisioning:/etc/grafana/provisioning:ro", "./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro", "grafana-data:/var/lib/grafana"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  ss-data:
  prom-data:
  grafana-data:
